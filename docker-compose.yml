# Optional: local PostgreSQL via Docker.
# Not required - `npm run dev:local` in /server starts an embedded Postgres instead.
services:
  postgres:
    image: postgres:16-alpine
    container_name: pariwar-care-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pariwar_care
    ports:
      - "5544:5432"
    volumes:
      - pariwar_pgdata:/var/lib/postgresql/data

volumes:
  pariwar_pgdata:
