# Requires a separate UTF8 DB, private bucket, HTTPS ingress and synthetic-only accounts.
# Secrets are supplied by the deployment secret store; never commit an env file.
services:
  api:
    build:
      context: ./server
      target: runtime
    environment:
      NODE_ENV: development
      APP_ENV: staging-test
      PORT: 8000
      DATABASE_URL: ${DATABASE_URL:?Separate UTF8 staging DB required}
      JWT_SECRET: ${JWT_SECRET:?Unique staging JWT secret required}
      QPAY_MODE: mock
      QPAY_CALLBACK_SECRET: ${QPAY_CALLBACK_SECRET:?Unique mock callback secret required}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?HTTPS staging callback URL required}
      STORAGE_DRIVER: s3
      S3_BUCKET: ${S3_BUCKET:?Private bucket required}
      S3_REGION: ${S3_REGION:?Region required}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      SMS_DRIVER: mock
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
